<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaba — 4D Algebra Symbolic CAS</title>
    
    <!-- Manifest and PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gaba">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Local Offline Libraries -->
    <link rel="stylesheet" href="lib/katex.min.css">
    <script defer src="lib/katex.min.js"></script>
    <script defer src="lib/auto-render.min.js"></script>
    <script src="lib/algebrite.min.js"></script>
    <script src="lib/marked.min.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">Gaba</div>
        <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: -1rem;">4D Algebra Spectral System</p>
        
        <nav class="nav-links">
            <li class="nav-item">
                <button class="nav-btn active" data-target="calculator">
                    <span>⚡</span> Calculator
                </button>
            </li>
        </nav>

        <div style="margin-top: auto; padding-top: 2rem;">
            <div class="card" style="padding: 1rem; border-radius: 12px; font-size: 0.75rem;">
                <p style="color: var(--text-secondary)">System Status</p>
                <div class="flex mt-1">
                    <span class="badge badge-blue">Offline Ready</span>
                    <span id="pwa-status" class="badge" style="background: rgba(255,255,255,0.05); color: var(--text-secondary)">Syncing...</span>
                </div>
                <button id="install-btn" class="op-btn primary" style="display: none; padding: 0.5rem; margin-top: 0.8rem; font-size: 0.75rem; width: 100%;">
                    ⬇️ Install as App
                </button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <!-- Calculator Section -->
        <section id="calculator" class="section active">
            <div class="panel-header">
                <h2>Scientific Calculator</h2>
            </div>

            <div class="card">
                <div class="row-group">
                    <div class="form-group" style="flex: 1;">
                        <label>Space Definition</label>
                        <select id="space-select">
                            <option value="M2">M2 (β<0, γ>0, δ>0)</option>
                            <option value="M3" selected>M3 (β>0, γ<0, δ>0)</option>
                            <option value="M4">M4 (β>0, γ>0, δ<0)</option>
                            <option value="M5">M5 (β<0, γ<0, δ>0)</option>
                            <option value="M6">M6 (β<0, γ>0, δ<0)</option>
                            <option value="M7">M7 (β>0, γ<0, δ<0)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Calculation Mode</label>
                        <select id="mode-select">
                            <option value="isotropic">Isotropic (α=1)</option>
                            <option value="anisotropic">Anisotropic (Custom)</option>
                        </select>
                    </div>
                </div>

                <div id="anisotropic-params" class="row-group" style="display: none; margin-top: 1rem;">
                    <div class="form-group" style="flex: 1;"><label>α</label><input type="text" id="param-alpha" value="1"></div>
                    <div class="form-group" style="flex: 1;"><label>β</label><input type="text" id="param-beta" value="1"></div>
                    <div class="form-group" style="flex: 1;"><label>γ</label><input type="text" id="param-gamma" value="-1"></div>
                    <div class="form-group" style="flex: 1;"><label>δ</label><input type="text" id="param-delta" value="1"></div>
                </div>
            </div>

            <div class="card">
                <label>Input Vector X = (x₁, x₂, x₃, x₄)</label>
                <div class="vector-grid">
                    <input type="text" id="x1" placeholder="x1" value="1">
                    <input type="text" id="x2" placeholder="x2" value="0">
                    <input type="text" id="x3" placeholder="x3" value="0">
                    <input type="text" id="x4" placeholder="x4" value="0">
                </div>

                <div id="y-input-container" style="display: none; margin-top: 1.5rem;">
                    <label>Input Vector Y = (y₁, y₂, y₃, y₄)</label>
                    <div class="vector-grid">
                        <input type="text" id="y1" placeholder="y1" value="0">
                        <input type="text" id="y2" placeholder="y2" value="1">
                        <input type="text" id="y3" placeholder="y3" value="0">
                        <input type="text" id="y4" placeholder="y4" value="0">
                    </div>
                </div>

                <div id="power-input-container" style="display: none; margin-top: 1.5rem;">
                    <div class="row-group">
                        <div class="form-group" id="frac-m-container" style="flex: 1; display: none;">
                            <label>Numerator m</label>
                            <input type="text" id="p-m" value="1">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Denominator n</label>
                            <input type="text" id="p-n" value="2">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <label>Select Operation</label>
                <div class="op-grid">
                    <button class="op-btn" data-op="add">X + Y</button>
                    <button class="op-btn" data-op="sub">X - Y</button>
                    <button class="op-btn" data-op="mul">X * Y</button>
                    <button class="op-btn" data-op="div">X / Y</button>
                    <button class="op-btn" data-op="pow">X^n</button>
                    <button class="op-btn" data-op="root">X^(m/n)</button>
                    <button class="op-btn" data-op="exp">exp(X)</button>
                    <button class="op-btn" data-op="ln">ln(X)</button>
                    <button class="op-btn" data-op="cos">cos(X)</button>
                    <button class="op-btn" data-op="sin">sin(X)</button>
                    <button class="op-btn" data-op="sqrt">sqrt(X)</button>
                    <button class="op-btn" data-op="inv">Inverse</button>
                    <button class="op-btn" data-op="norm">Norm Squared</button>
                    <button class="op-btn" data-op="spectrum">Spectrum</button>
                </div>
                <div class="row-group" style="margin-top: 1.5rem; gap: 1rem;">
                    <button class="op-btn primary" id="btn-calculate" style="flex: 2; font-size: 1.1rem;">
                        🚀 Calculate Result
                    </button>
                    <button class="op-btn" id="clear-console" style="flex: 1;">
                        🗑️ Clear
                    </button>
                </div>
            </div>

            <div class="card results-container" id="results">
                <div class="panel-header" style="border: none; margin-bottom: 0.5rem;">
                    <h3 style="font-size: 1rem;">Output Logs</h3>
                </div>
                <!-- Dynamic results inserted here -->
                <div id="log-output"></div>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="copy-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Select Components to Copy</h3>
            </div>
            <div class="checkbox-list" id="modal-checkboxes">
                <!-- Checkboxes injected here -->
            </div>
            <div class="modal-actions">
                <button class="op-btn primary" id="modal-confirm" style="flex: 2; margin-top: 0">Confirm & Copy</button>
                <button class="op-btn" id="modal-cancel" style="flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
